<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搶紅包 - 管理後台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Background Particles -->
  <div class="particles-container" id="particles"></div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Edit Prize Modal -->
  <div class="edit-modal-overlay" id="editModal">
    <div class="edit-modal">
      <h3 id="editModalTitle">編輯獎品</h3>
      <input type="hidden" id="editPrizeIndex">
      <div class="edit-form-group">
        <label>Emoji</label>
        <input type="text" id="editEmoji" placeholder="🧧" maxlength="4">
      </div>
      <div class="edit-form-group">
        <label>獎品名稱</label>
        <input type="text" id="editName" placeholder="獎品名稱" maxlength="30">
      </div>
      <div class="edit-form-group">
        <label>數量</label>
        <input type="number" id="editTotal" placeholder="1" min="1" max="9999">
      </div>
      <div class="edit-modal-actions">
        <button class="btn btn-outline btn-sm" onclick="closeEditModal()">取消</button>
        <button class="btn btn-gold btn-sm" onclick="saveEditPrize()">儲存</button>
      </div>
    </div>
  </div>

  <!-- Confirm Dialog -->
  <div class="confirm-overlay" id="confirmDialog">
    <div class="confirm-dialog">
      <span class="confirm-emoji">⚠️</span>
      <p id="confirmMessage">確定要執行此操作嗎？</p>
      <div class="confirm-actions">
        <button class="btn btn-outline btn-sm" onclick="closeConfirm()">取消</button>
        <button class="btn btn-danger btn-sm" id="confirmBtn" onclick="confirmAction()">確定</button>
      </div>
    </div>
  </div>

  <div class="admin-container">
    <div class="header">
      <h1>管理後台</h1>
      <p class="subtitle">搶紅包系統設定</p>
    </div>

    <!-- Password Screen -->
    <div id="passwordScreen" class="password-screen">
      <span class="big-emoji">🔒</span>
      <h2>請輸入管理密碼</h2>
      <div class="password-input-group">
        <input type="password" id="passwordInput" placeholder="管理密碼"
               onkeydown="if(event.key==='Enter')verifyPassword()">
        <button class="btn btn-gold" onclick="verifyPassword()">登入</button>
      </div>
      <div style="margin-top: 16px;">
        <p style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 8px;">API 網址</p>
        <div class="api-input-group" style="max-width: 320px;">
          <input type="text" id="apiUrlInputLogin" placeholder="Google Apps Script 部署 URL">
          <button class="btn btn-outline btn-sm" onclick="saveApiUrlFromLogin()">儲存</button>
        </div>
      </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminDashboard" style="display:none;">

      <!-- API Settings -->
      <div class="admin-panel">
        <h3>🔗 API 設定</h3>
        <div class="api-input-group">
          <input type="text" id="apiUrlInput" placeholder="Google Apps Script 部署 URL">
          <button class="btn btn-gold btn-sm" onclick="saveApiUrl()">儲存</button>
        </div>
      </div>

      <!-- Prize Management -->
      <div class="admin-panel">
        <h3>🎁 獎品管理</h3>
        <div id="prizeListAdmin" class="prize-list-admin"></div>
        <div style="margin-top: 12px; display: flex; gap: 8px;">
          <button class="btn btn-gold btn-sm" onclick="openAddPrize()">+ 新增獎品</button>
          <button class="btn btn-red btn-sm" onclick="savePrizesToServer()">儲存到伺服器</button>
        </div>
      </div>

      <!-- Preview -->
      <div class="admin-panel">
        <h3>👀 即時預覽</h3>
        <div id="previewGrid" class="preview-grid"></div>
      </div>

      <!-- Statistics -->
      <div class="admin-panel">
        <h3>📊 搶取統計</h3>
        <div id="statsContainer">
          <div class="loading-overlay" style="padding: 20px;">
            <div class="loading-spinner"></div>
            <span>載入中...</span>
          </div>
        </div>
      </div>

      <!-- Records -->
      <div class="admin-panel">
        <h3>📋 搶紅包紀錄</h3>
        <div class="action-bar" style="margin-bottom: 12px;">
          <button class="btn btn-outline btn-sm" onclick="loadRecords()">重新載入</button>
          <button class="btn btn-outline btn-sm" onclick="exportCSV()">匯出 CSV</button>
          <button class="btn btn-danger btn-sm" onclick="confirmClearRecords()">清除全部紀錄</button>
        </div>
        <div id="recordsContainer">
          <div class="loading-overlay" style="padding: 20px;">
            <div class="loading-spinner"></div>
            <span>載入中...</span>
          </div>
        </div>
      </div>

    </div>

    <!-- Footer Nav -->
    <div class="footer-nav">
      <a href="index.html">回到搶紅包頁面</a>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
